AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TeamOps AI synthetic ingestion workflow and read-only diagnostics
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 128
    Architectures:
      - x86_64
Parameters:
  KnowledgeBaseId:
    Type: String
    Description: Existing Bedrock Knowledge Base ID; required for retrieval Lambda
    AllowedPattern: '[A-Za-z0-9]{10}'
  GlueDiagnosticJobName:
    Type: String
    Default: ''
    Description: Optional allowed AWS Glue job for diagnostics
    AllowedPattern: '^$|^[A-Za-z0-9_-]{1,255}$'
  HarnessArn:
    Type: String
    Description: Existing AgentCore Harness ARN for the private chat adapter
    AllowedPattern: 'arn:aws[a-zA-Z-]*:bedrock-agentcore:.+:harness/.+'
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  ExecutionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: execution_id
          AttributeType: S
      KeySchema:
        - AttributeName: execution_id
          KeyType: HASH
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-processor'
      CodeUri: src/processor/
      Handler: app.lambda_handler
      Environment:
        Variables:
          EXECUTIONS_TABLE: !Ref ExecutionsTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - DynamoDBWritePolicy:
            TableName: !Ref ExecutionsTable
  DiagnosticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-diagnostics'
      CodeUri: src/diagnostics/
      Handler: app.lambda_handler
      Environment:
        Variables:
          EXECUTIONS_TABLE: !Ref ExecutionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExecutionsTable
  GlueDiagnosticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-glue-diagnostics'
      CodeUri: src/glue_diagnostics/
      Handler: app.lambda_handler
      Environment:
        Variables:
          GLUE_JOB_NAME: !Ref GlueDiagnosticJobName
      Policies:
        - Statement:
            - Sid: ReadOnlyAllowedGlueJobRuns
              Effect: Allow
              Action:
                - glue:GetJobRuns
                - glue:GetJobRun
              Resource: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${GlueDiagnosticJobName}'
  ChatSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserHistoryIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  DashboardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dashboard-api'
      CodeUri: src/dashboard_api/
      Handler: app.lambda_handler
      Timeout: 35
      MemorySize: 128
      Environment:
        Variables:
          DIAGNOSTICS_FUNCTION: !Ref DiagnosticsFunction
          KNOWLEDGE_FUNCTION: !Ref KnowledgeRetrievalFunction
          ALLOWED_GROUP: teamops-users
      Policies:
        - Statement:
            - Sid: InvokeDashboardServices
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt DiagnosticsFunction.Arn
                - !GetAtt KnowledgeRetrievalFunction.Arn
  ChatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-chat-api'
      CodeUri: src/chat_api/
      Handler: app.lambda_handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          HARNESS_ARN: !Ref HarnessArn
          CHAT_SESSIONS_TABLE: !Ref ChatSessionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatSessionsTable
        - Statement:
            - Sid: InvokeOnlyTeamOpsHarness
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
                - bedrock-agentcore:InvokeHarness
              Resource: !Ref HarnessArn
  KnowledgeRetrievalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-kb-retrieval'
      CodeUri: src/kb_retrieval/
      Handler: app.lambda_handler
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
      Policies:
        - Statement:
            - Sid: RetrieveOnlyConfiguredKnowledgeBase
              Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}'
Outputs:
  ChatApiFunctionName:
    Value: !Ref ChatApiFunction
  ChatApiFunctionArn:
    Value: !GetAtt ChatApiFunction.Arn
  KnowledgeRetrievalFunctionName:
    Value: !Ref KnowledgeRetrievalFunction
  KnowledgeRetrievalFunctionArn:
    Value: !GetAtt KnowledgeRetrievalFunction.Arn
  DataBucketName:
    Value: !Ref DataBucket
  ExecutionsTableName:
    Value: !Ref ExecutionsTable
  ProcessorFunctionName:
    Value: !Ref ProcessorFunction
  DiagnosticsFunctionName:
    Value: !Ref DiagnosticsFunction
  GlueDiagnosticsFunctionName:
    Value: !Ref GlueDiagnosticsFunction
  GlueDiagnosticsFunctionArn:
    Value: !GetAtt GlueDiagnosticsFunction.Arn
